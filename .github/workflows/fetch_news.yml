name: Fetch News

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # pozwala odpalić ręcznie

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          ref: main # Zapobiega stanowi detached HEAD
          fetch-depth: 0

      - name: Uruchom skrypt pobierający newsy
        run: |
          chmod +x ./scripts/fetch_news.sh
          ./scripts/fetch_news.sh

      - name: Zapisz zmiany w repozytorium (Git Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Dodaj folder z danymi (ignoruj jeśli jeszcze nie powstał)
          git add rawdata/ 2>/dev/null || true

          # Sprawdź czy są jakiekolwiek zmiany do zapisania
          if git diff --staged --quiet; then
            echo "Brak nowych newsów. Kończę zadanie."
          else
            git commit -m "Auto: dodano nowe newsy [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
