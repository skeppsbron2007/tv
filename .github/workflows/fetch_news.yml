name: Fetch News

on:
  schedule:
    # Uruchamia się co 15 minut (w 7, 22, 37 i 52 minucie każdej godziny czasu UTC)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Uruchom skrypt pobierający newsy
        run: |
          # Zamiast chmod +x, bezpieczniej uruchomić skrypt bezpośrednio przez powłokę bash
          # Dzięki temu nie modyfikujesz uprawnień plików wewnątrz gita
          bash ./scripts/fetch_news.sh

      - name: Zapisz zmiany w repozytorium (Git Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Dodaj tylko nowe/zmienione pliki z newsami (np. katalog rawdata)
          # Jeśli skrypt tworzy pliki w konkretnym folderze, lepiej wskazać go wprost, np. git add rawdata/
          git add -A

          # Sprawdź czy są faktyczne zmiany w plikach
          if git diff --staged --quiet; then
            echo "Brak nowych newsów. Kończę zadanie."
          else
            # USUNIĘTO [skip ci] - teraz cron nie zostanie zablokowany
            git commit -m "Auto: dodano nowe newsy"
            git push origin main
          fi
