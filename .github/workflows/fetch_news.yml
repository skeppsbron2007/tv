name: Fetch News

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Uruchom skrypt pobierający newsy
        run: |
          chmod +x ./scripts/fetch_news.sh
          ./scripts/fetch_news.sh

      - name: Zapisz zmiany w repozytorium (Git Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Dodaj wszystkie zmiany (w tym uprawnienia do skryptu i nowe pliki w rawdata)
          git add -A

          # 2. Jeśli są nowe pliki, zatwierdź i wyślij do repozytorium
          if git diff --staged --quiet; then
            echo "Brak nowych newsów. Kończę zadanie."
          else
            git commit -m "Auto: dodano nowe newsy [skip ci]"
            git push origin main
          fi
